<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1050" width="100%" height="100%">
  <defs>
    <!-- 
      Brand Color Palette:
      Vivid Red: #E61C39
      Warm Off-White: #F5F1EC
      Deep Burgundy: #9C1328
    -->
  </defs>

  <!-- DEEP BURGUNDY 3D SHADOW EXTRUSIONS -->
  <g id="logo-shadow" fill="#9C1328" transform="translate(-25, 25)">
    <!-- G Base Shadow -->
    <path d="M 500,150 L 250,150 L 100,300 L 100,700 L 250,850 L 550,850 L 550,450 L 350,450 L 350,600 L 400,600 L 400,700 L 250,700 L 250,300 L 500,300 Z" />
    
    <!-- ? Base Shadow -->
    <path d="M 600,150 L 800,150 L 950,300 L 950,450 L 800,600 L 800,720 L 650,720 L 650,600 L 800,450 L 800,300 L 600,300 Z" />
    
    <!-- Dot Base Shadow -->
    <path d="M 650,770 L 800,770 L 800,850 L 730,920 L 650,920 Z" />
  </g>

  <!-- VIVID RED BASE SHAPES -->
  <g id="logo-base" fill="#E61C39">
    <!-- G Base -->
    <path d="M 500,150 L 250,150 L 100,300 L 100,700 L 250,850 L 550,850 L 550,450 L 350,450 L 350,600 L 400,600 L 400,700 L 250,700 L 250,300 L 500,300 Z" />
    
    <!-- ? Base -->
    <path d="M 600,150 L 800,150 L 950,300 L 950,450 L 800,600 L 800,720 L 650,720 L 650,600 L 800,450 L 800,300 L 600,300 Z" />
    
    <!-- Dot Base -->
    <path d="M 650,770 L 800,770 L 800,850 L 730,920 L 650,920 Z" />
  </g>

  <!-- WARM OFF-WHITE INNER GAMING HIGHLIGHTS -->
  <g id="logo-highlights" fill="#F5F1EC">
    <!-- G Inner Blade -->
    <path d="M 150,330 L 150,680 L 270,800 L 500,800 L 500,750 L 280,750 L 200,670 L 200,330 Z" />
    
    <!-- ? Inner Blade -->
    <path d="M 900,330 L 900,430 L 770,560 L 770,690 L 720,690 L 720,540 L 850,410 L 850,330 Z" />
    
    <!-- Dot Inner Highlight -->
    <path d="M 680,800 L 770,800 L 770,840 L 720,890 L 680,890 Z" />
  </g>
</svg>
